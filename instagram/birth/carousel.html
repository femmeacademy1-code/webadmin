<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><title>קרוסלה – 5 סימנים ללידה</title>
<style>
@font-face{font-family:"Ploni Yad";src:url(../../app/fonts/ploni-yad.woff2) format("woff2")}
@font-face{font-family:"Assistant";font-weight:200 800;src:url(../../app/fonts/assistant-hebrew.woff2) format("woff2");unicode-range:U+0307-0308,U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:"Assistant";font-weight:200 800;src:url(../../app/fonts/assistant-latin.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+2000-206F,U+20AC,U+2122,U+2212}
:root{--rose:#c0504d;--ink:#2b2b3a;--teal:#2f9a90;--peach:#f4a27c}
*{box-sizing:border-box}html{direction:ltr}html,body{margin:0;background:#fff}
#pano{position:relative;width:1080px;height:1350px;direction:ltr;overflow:hidden}
.s{background-size:8640px 1350px;background:
 radial-gradient(900px 800px at 0% 0%,rgba(244,168,136,.8),transparent 70%),
 radial-gradient(1000px 800px at 12% 100%,rgba(160,234,222,.9),transparent 70%),
 radial-gradient(1000px 800px at 26% 10%,rgba(160,234,222,.85),transparent 70%),
 radial-gradient(1000px 800px at 38% 100%,rgba(244,168,136,.7),transparent 70%),
 radial-gradient(1000px 800px at 50% 10%,rgba(244,168,136,.6),transparent 70%),
 radial-gradient(1000px 800px at 62% 100%,rgba(160,234,222,.9),transparent 70%),
 radial-gradient(1000px 800px at 76% 10%,rgba(244,168,136,.7),transparent 70%),
 radial-gradient(1100px 900px at 100% 70%,rgba(160,234,222,.9),transparent 70%),
 linear-gradient(180deg,#f4fcfa,#fff7f1);background-size:8640px 1350px}
.s{position:absolute;top:0;left:0;width:1080px;height:1350px;direction:rtl;font-family:Assistant,sans-serif;color:var(--ink);padding:110px 90px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:visible}
h1,h2{font-family:"Ploni Yad",Assistant,sans-serif;font-weight:400;margin:0;line-height:1.1}
.o{background:linear-gradient(100deg,#9c3b3b,var(--rose) 50%,#d9776a);-webkit-background-clip:text;background-clip:text;color:transparent}
.t{background:linear-gradient(100deg,#1c6f66,#2fa095 50%,#5cc4b6);-webkit-background-clip:text;background-clip:text;color:transparent}
.big{font-size:108px}.mid{font-size:92px}.sm{font-size:64px}
.sub{font-size:44px;line-height:1.5;font-weight:600;margin:34px 0 0;max-width:820px}
.o .w{background:linear-gradient(100deg,#9c3b3b,#c0504d 50%,#d9776a);-webkit-background-clip:text;background-clip:text;color:transparent}
.t .w{background:linear-gradient(100deg,#1c6f66,#2fa095 50%,#5cc4b6);-webkit-background-clip:text;background-clip:text;color:transparent}
.w{display:inline-block;opacity:0;transform:translateY(60px) rotate(4deg);animation:rise .9s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--d,0s) + var(--i)*.09s)}
@keyframes rise{to{opacity:1;transform:none}}
.fade{opacity:0;animation:fadeUp .9s ease forwards;animation-delay:var(--d,1.6s)}
@keyframes fadeUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
.num{position:absolute;top:96px;width:190px;height:190px;border-radius:50%;display:grid;place-items:center;font:400 120px "Ploni Yad";color:#fff;background:linear-gradient(135deg,var(--rose),#e58b7c);box-shadow:0 24px 40px -18px rgba(192,80,77,.7);transform:scale(0);animation:pop .7s cubic-bezier(.3,1.6,.5,1) .15s forwards}
.num.t2{background:linear-gradient(135deg,#1c8e83,#5cc4b6);box-shadow:0 24px 40px -18px rgba(47,154,144,.7)}
.num::after{content:"";position:absolute;inset:-18px;border-radius:50%;border:4px dashed rgba(47,154,144,.55);animation:spin 10s linear infinite}
@keyframes pop{to{transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
.bar{position:absolute;bottom:70px;left:90px;right:90px;height:12px;border-radius:9px;background:rgba(43,43,58,.1);overflow:hidden;direction:ltr}
.bar i{display:block;height:100%;width:var(--p);background:linear-gradient(90deg,var(--teal),#5cc4b6);border-radius:9px;transform-origin:left;transform:scaleX(0);animation:grow 1.4s ease .6s forwards}
@keyframes grow{to{transform:scaleX(1)}}
.cue{position:absolute;bottom:106px;inset-inline-end:90px;font:800 36px Assistant;color:var(--teal);animation:nudge 1.5s ease-in-out 2.4s infinite;opacity:0;animation-fill-mode:forwards}
@keyframes nudge{0%,100%{transform:translateX(0);opacity:1}50%{transform:translateX(-18px);opacity:1}}
.d{position:absolute;pointer-events:none;filter:drop-shadow(0 10px 12px rgba(60,40,40,.16));opacity:0;animation:dIn .8s ease forwards,float 4.5s ease-in-out infinite;animation-delay:var(--d,.4s),0s}
@keyframes dIn{to{opacity:1}}
@keyframes float{0%,100%{translate:0 0;rotate:-3deg}50%{translate:0 -26px;rotate:4deg}}
.beat{animation:dIn .6s ease forwards,beat 1.5s ease-in-out infinite!important;animation-delay:.2s,.8s}
@keyframes beat{0%,100%{scale:1}15%{scale:1.14}30%{scale:1}45%{scale:1.1}}
.fly{animation:dIn .6s ease forwards,flyp 4.5s ease-in-out infinite!important}
@keyframes flyp{0%,100%{translate:0 0;rotate:-8deg}50%{translate:60px -50px;rotate:10deg}}
.ring{position:absolute;border-radius:50%;border:5px solid rgba(192,80,77,.5);animation:ring 3s ease-out infinite;opacity:0}
@keyframes ring{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.8);opacity:0}}
.card{background:rgba(255,255,255,.86);border:4px solid rgba(47,154,144,.3);border-radius:48px;padding:56px 54px;box-shadow:0 34px 60px -30px rgba(60,40,40,.45);max-width:900px;text-align:center}
.card p{font-size:44px;line-height:1.55;font-weight:600;margin:0 0 22px}
.btn{margin-top:36px;background:var(--rose);color:#fff;border-radius:999px;padding:30px 72px;font:800 52px Assistant;box-shadow:0 20px 0 -8px #8d3a38;opacity:0;animation:fadeUp .8s ease 2.6s forwards,pulse 1.6s ease-in-out 3.4s infinite}
@keyframes pulse{0%,100%{scale:1}50%{scale:1.07}}
.duo{position:absolute;bottom:-96px;width:520px;left:50%;margin-left:-260px;opacity:0;transform:translateY(300px);animation:slideUp 1.1s cubic-bezier(.2,.8,.2,1) 1.2s forwards}
@keyframes slideUp{to{opacity:1;transform:none}}
.logo{width:300px;opacity:0;animation:fadeUp .8s ease .1s forwards}
</style></head><body><div id="pano"></div>
<script>
const P=document.getElementById('pano');
const words=(t,d=0,start=0)=>t.split(' ').map((w,i)=>`<span class="w" style="--i:${i+start};--d:${d}s">${w}</span>`).join(' ');
const dd=(f,x,y,wd,extra='',d='.4s',cls='')=>`<img class="d ${cls}" src="../../app/brand/dd/${f}.png" style="left:${x}px;top:${y}px;width:${wd}px;--d:${d};${extra}" alt="">`;
const S=[];
// 1 hook
S.push(`<div class="ring" style="width:380px;height:380px;top:150px;left:350px"></div><div class="ring" style="width:380px;height:380px;top:150px;left:350px;animation-delay:1.5s"></div>
${dd('hearts',390,225,300,'','.2s','beat')}
<h1 class="big o" style="margin-top:300px">${words('5 סימנים שהעסק שלך',.5)}<br><span class="t">${words('עובר תהליך של לידה',1.0,4)}</span></h1>
<p class="sub fade" style="--d:2.2s">ואת צריכה את הצוות הנכון לצידך</p>
${dd('sparkles',70,150,200,'','.9s')}${dd('bfly-s',800,1060,200,'','1.2s','fly')}${dd('star',860,200,110,'','1.4s')}
<div class="cue" style="animation-delay:2.8s">החליקי ‹</div>`);
const signs=[
 ['כשהרעיונות שלך גדולים יותר מהיכולת הטכנית שלך לבצע אותם','ואת מרגישה שהם נשארים רק בראש','bolt','o'],
 ['כשהנראות הנוכחית שלך כבר לא הולמת את המקצועיות שלך','הגיע הזמן שהדיגיטל ידבר כמוך','camera','t'],
 ['כשיש לך שירות חדש ומרגש שחייב במה משלו','ולא רק פוסט בפיד שנעלם אחרי 24 שעות','megaphone','o'],
 ['כשאת צריכה מישהי שתחזיק לך את היד','כשהפחד מחשיפה עולה','hearts','t'],
 ['כשאת מבינה שהעסק שלך כבר לא תחביב','הוא השליחות שלך','crown','o']];
signs.forEach((s,k)=>{
 const num=k+1;
 S.push(`<div class="num ${k%2?'t2':''}">${num}</div>
 ${dd(s[2],k%2?110:760,110,220,'','.9s')}
 <h2 class="mid ${s[3]}" style="margin-top:230px;max-width:880px">${words(s[0],.6)}</h2>
 <p class="sub fade" style="--d:2.2s">${s[1]}</p>
 ${dd(k%2?'sparkle':'star',k%2?800:90,k%2?980:1000,120,'','1.5s')}
 <div class="bar"><i style="--p:${num*20}%"></i></div><div class="cue">‹</div>`);
});
// 7 copy
S.push(`${dd('butterfly',60,90,230,'','.5s','fly')}${dd('flower-s',820,1000,170,'','1.6s')}
<div class="card"><h2 class="sm t" style="margin-bottom:26px">${words('לבנות אתר זה לא רק קוד ועיצוב',.3)}</h2>
<p class="fade" style="--d:1.6s">זה תהליך של להוציא משהו ממך החוצה לעולם.</p>
<p class="fade" style="--d:2.2s">זה רגיש, זה מפחיד לפעמים – וזה דורש ליווי שהוא גם מקצועי וגם רגשי.</p>
<p class="fade" style="--d:2.9s;font-weight:800;color:var(--rose)">אנחנו כאן כדי שהלידה הזו תהיה רכה, מדויקת ועוצמתית.</p></div>
${dd('hearts',430,1090,180,'','3.2s','beat')}<div class="cue" style="animation-delay:3.4s">‹</div>`);
// 8 CTA
S.push(`<img class="logo" src="../../app/brand/logo.png" style="position:absolute;top:70px;width:260px" alt="">
<h1 class="big o" style="margin-top:60px;font-size:108px">${words('הגיע הזמן',.5)}<br><span class="t">${words('ללדת אותו?',.9,2)}</span></h1>
<p class="sub fade" style="--d:1.6s">שלחי לנו הודעה לתיאום <b>דייט עסקי</b><br>ונבנה יחד את הבית הדיגיטלי שלך</p>
<div class="btn" style="margin-top:26px;padding:24px 62px;font-size:46px">דברי איתנו ←</div>
<p class="fade" style="--d:3s;font:800 38px Assistant;color:var(--teal);direction:ltr;margin:20px 0 0">femme-digital.com</p>
<img class="duo" src="../../app/brand/duo-cut.webp" alt="">${dd('sparkles',70,420,200,'','1.4s')}${dd('star',860,330,120,'','1.6s')}${dd('bfly-s',850,640,190,'','1.8s','fly')}`);
S.forEach((h,i)=>{const e=document.createElement('section');e.className='s';e.style.backgroundPosition=`${-i*1080}px 0`;e.dataset.i=i;e.style.display=i===0?'flex':'none';e.innerHTML=h;P.appendChild(e)});
</script></body></html>
