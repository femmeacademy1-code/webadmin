<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f7f3ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="לידים אלטרנייטיב">
<link rel="icon" type="image/png" href="alt-icon.png">
<link rel="apple-touch-icon" href="alt-icon.png">
<title>מעקב לידים אלטרנייטיב</title>
<style>
@font-face{font-family:"Assistant";font-weight:200 800;font-display:swap;src:url(fonts/assistant-hebrew.woff2) format("woff2");unicode-range:U+0307-0308,U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:"Assistant";font-weight:200 800;font-display:swap;src:url(fonts/assistant-latin.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
/* Layout: one working column. Summary numbers on top, pipeline tabs as the filter, lead cards below, editor slides in over the list. */
:root{
  --bg:#f7f3ef; --surface:#ffffff; --ink:#2b2321; --muted:#766a65; --line:#e6dcd5;
  --accent:#b8473f; --accent-ink:#ffffff; --good:#1f7a6d; --warn:#9a6a14; --bad:#b3261e; --chip:#f1e8e1;
  --s-talked:#9a8f8a; --s-hot:#d9534f; --s-catalog:#7e5bb5; --s-visit:#b5589a; --s-season:#5f7fa8; --s-viewing:#c98a1b; --s-closing:#2f7fb8; --s-delivered:#1f7a6d; --s-done:#4a5d57; --s-lost:#b5aaa4;
  --f-display:"Assistant",system-ui,sans-serif; --f-body:"Assistant",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1c1716; --surface:#271f1f; --ink:#f3ebe7; --muted:#ab9d97; --line:#3b3231;
  --accent:#e57d72; --accent-ink:#2b1210; --good:#5cc4b6; --warn:#e0b04a; --bad:#f0837a; --chip:#33292a;
  --s-talked:#a89c96; --s-hot:#ef7a74; --s-catalog:#b79ae6; --s-visit:#e08fc5; --s-season:#9db6d9; --s-viewing:#e3a845; --s-closing:#6db3e3; --s-delivered:#5cc4b6; --s-done:#8fa8a0; --s-lost:#7f726d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1c1716; --surface:#271f1f; --ink:#f3ebe7; --muted:#ab9d97; --line:#3b3231;
  --accent:#e57d72; --accent-ink:#2b1210; --good:#5cc4b6; --warn:#e0b04a; --bad:#f0837a; --chip:#33292a;
  --s-talked:#a89c96; --s-hot:#ef7a74; --s-viewing:#e3a845; --s-closing:#6db3e3; --s-delivered:#5cc4b6; --s-done:#8fa8a0; --s-lost:#7f726d; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:max(20px,env(safe-area-inset-top,0px)) 80px}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}

header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
h1{font-family:var(--f-display);font-weight:400;font-size:30px;margin:0;line-height:1.2}
.hbtns{display:flex;gap:8px;flex-wrap:wrap}
a.btn{color:inherit;text-decoration:none;display:inline-block}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 16px;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:4px 12px;font-size:14px}
.btn.danger{color:var(--bad)}

.sum{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px}
.sumhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.sumhead h2{font-size:17px;margin:0;font-weight:800}
select,input,textarea{background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:7px 10px;width:100%;min-width:0}
.sumhead select{width:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:14px 18px}
.kpi{display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi span{font-size:14px;color:var(--muted)}
.kpi b{font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1.2}
.kpi.big b{font-size:34px;color:var(--good)}
.kpi small{font-size:13px;color:var(--muted)}

.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.tab{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;display:flex;gap:8px;align-items:center;font-weight:600}
.tab i{width:9px;height:9px;border-radius:50%;background:var(--c,var(--muted))}
.tab em{font-style:normal;font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab[aria-pressed="true"] em{color:inherit;opacity:.8}

.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0;text-align:start;cursor:pointer;border-inline-start:5px solid var(--c)}
.card:hover{border-color:var(--c)}
.card h3{margin:0;font-size:19px;font-weight:800;overflow-wrap:anywhere}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.pill{font-size:13px;font-weight:600;border-radius:999px;padding:1px 10px;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
.prod{color:var(--muted);font-size:15px;overflow-wrap:anywhere}
.due{font-size:14px;color:var(--muted)}
.due.late{color:var(--bad);font-weight:600}
.money{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.money b{color:var(--good);font-weight:800}
.money b.neg{color:var(--bad)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.empty{grid-column:1/-1;border:2px dashed var(--line);border-radius:14px;padding:36px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:19px;margin-bottom:4px}

/* editor */
.veil{position:fixed;inset:0;background:rgba(20,12,10,.45);z-index:20;display:flex;justify-content:flex-start}
.sheet{background:var(--bg);width:min(560px,100%);height:100%;overflow-y:auto;padding:20px max(16px,env(safe-area-inset-left,0px)) 40px;padding-top:max(20px,env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:16px}
.sheet h2{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label{font-size:14px;font-weight:600;color:var(--muted)}
.f.full{grid-column:1/-1}
fieldset{border:1px solid var(--line);border-radius:12px;padding:14px;margin:0;background:var(--surface);min-width:0}
legend{font-weight:800;padding:0 6px}
.chk{display:flex;gap:8px;align-items:center;font-size:15px;grid-column:1/-1}
.chk input{width:auto}
.calc{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px 14px;border-top:1px dashed var(--line);padding-top:10px;font-size:14px}
.calc div{display:flex;flex-direction:column}
.calc span{color:var(--muted)}
.calc b{font-size:18px;font-variant-numeric:tabular-nums}
.calc .pf b{color:var(--good)} .calc .pf.neg b{color:var(--bad)}
.stages{display:flex;gap:6px;flex-wrap:wrap}
.stg{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-weight:600;font-size:14px}
.stg[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
.log{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:2px;margin:0;padding:0;list-style:none}
.sbar{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;position:sticky;bottom:0;background:var(--bg);padding:10px 0}
.toast{position:fixed;bottom:max(18px,env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;z-index:40;max-width:90vw}
.login{max-width:380px;margin:12vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:14px}
.login h1{font-size:28px}
.err{color:var(--bad);font-size:15px;min-height:1.4em}
.hint{border:1.5px solid var(--good);background:color-mix(in srgb,var(--good) 12%,var(--surface));border-radius:10px;padding:10px 12px;font-size:15px}
.hint b{display:block}
.busy{position:fixed;inset:0;background:rgba(20,12,10,.45);z-index:30;display:grid;place-items:center}
.busy div{background:var(--surface);padding:18px 26px;border-radius:12px;font-weight:600}
#row_extras:not([hidden]){display:flex;flex-direction:column;gap:12px}
.xo{border-top:1px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.xo:first-of-type{border-top:0;padding-top:0}
.xh{display:flex;gap:8px;align-items:center;justify-content:space-between}
.x3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.xrow{width:100%;background:none;border:0;border-top:1px solid var(--line);text-align:start;color:inherit;cursor:pointer}
.drow{display:flex;gap:10px;align-items:baseline;padding:5px 0;border-top:1px solid var(--line);font-size:15px}
.drow span:nth-child(2){flex:1;min-width:0;overflow-wrap:anywhere}
#dealList summary{cursor:pointer;font-weight:600;color:var(--muted)}
.selbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1.5px solid var(--line);padding:10px max(16px,env(safe-area-inset-left,0px)) max(10px,env(safe-area-inset-bottom,0px));display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center}
.selbar input{width:auto}
.card.sel{outline:3px solid var(--accent)}
.card.pick::before{content:'☐';font-size:22px}
.card.pick.sel::before{content:'☑'}
.cnote{white-space:pre-wrap;font-size:14.5px;background:var(--chip);border-radius:8px;padding:6px 10px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.card.lostc{opacity:.65}
.brand{background:#2b2321;border-radius:14px;padding:12px 16px;display:flex;justify-content:center}
.brand img{height:86px;width:auto;max-width:100%;object-fit:contain}
.sheet.wide{width:min(780px,100%)}
.pjcat{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:14px;font-weight:800}
.pjrow{border-top:1px dashed var(--line);padding:8px 0;display:flex;flex-direction:column;gap:6px}
.pjh{display:flex;gap:8px;align-items:center}
.pjh .pl{flex:1}
.x3p{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pjsum .drow b{font-variant-numeric:tabular-nums}
.pjbig{font-family:var(--f-display);font-size:30px;color:var(--good);line-height:1.2}
.pjbig.neg{color:var(--bad)}
.note{color:var(--muted);font-size:14px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}h1{font-size:26px}.kpi b{font-size:22px}.kpi.big b{font-size:28px}}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}
</style>


</head>
<body>
<form class="login" id="login" dir="rtl" hidden>
  <div class="brand"><img src="alt-logo.png" alt="Alternative"></div>
  <h1>מעקב לידים אלטרנייטיב</h1>
  <p class="note" id="l_note">מעקב לידים ומכירות</p>
  <div class="f" id="l_adminRow" hidden><label for="l_admin">סיסמת הניהול (פעם אחת, להגדרת הסיסמה)</label><input id="l_admin" type="password" autocomplete="off" dir="ltr"></div>
  <div class="f"><label for="l_pass" id="l_passLbl">סיסמה</label><input id="l_pass" type="password" autocomplete="current-password" dir="ltr"></div>
  <div class="err" id="l_err" role="alert"></div>
  <button class="btn pri" type="submit" id="l_btn">כניסה</button>
</form>
<div class="wrap" id="app" dir="rtl" lang="he" hidden>
  <div class="brand"><img src="alt-logo.png" alt="Alternative – פתרונות אלטרנטיביים לאירוח בטבע"></div>
  <header>
    <h1>מעקב לידים אלטרנייטיב</h1>
    <div class="hbtns">
      <button class="btn" id="projBtn" type="button">🏗️ תמחור פרויקטים</button>
      <button class="btn" id="shipBtn" type="button">🚚 משלוחים בדרך</button>
      <button class="btn" id="moneyBtn" type="button">💰 ניהול כספי</button>
      <button class="btn pri" id="backBtn" type="button" hidden>← חזרה ללידים</button>
      <button class="btn" id="settingsBtn" type="button">הגדרות</button>
      <button class="btn" id="outBtn" type="button">יציאה</button>
      <button class="btn" id="csvBtn" type="button">ייצוא לאקסל</button>
      <button class="btn" id="shotBtn" type="button">📷 הוספה מצילום</button>
      <button class="btn" id="impBtn" type="button">📥 ייבוא מקובץ</button>
      <button class="btn" id="selBtn" type="button">☑ בחירה מרובה</button>
      <button class="btn pri" id="newBtn" type="button">＋ ליד חדש</button>
      <input type="file" id="shotIn" accept="image/*" multiple hidden>
      <input type="file" id="impIn" accept=".xlsx,.xls,.csv,image/*" multiple hidden>
    </div>
  </header>

  <section class="sum" id="sumBox" aria-label="ניהול כספי" hidden>
    <div class="sumhead">
      <h2>הכסף שנכנס</h2>
      <span style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" type="button" id="expAdd">＋ הוצאת שיווק</button><button class="btn sm" type="button" id="expMgr">✎ עריכת הוצאות</button><select id="period" aria-label="תקופה"></select></span>
    </div>
    <div class="kpis" id="kpis"></div>
    <details id="dealList" hidden></details>
    <details id="expList" hidden></details>
  </section>

  <section class="sum" id="shipBox" aria-label="משלוחים בדרך" hidden></section>
  <section class="sum" id="projBox" aria-label="תמחור פרויקטים" hidden></section>
  <div class="tabs" id="tabs" role="group" aria-label="שלבים"></div>
  <div class="row" id="periodBar" hidden><span class="note" id="periodNote"></span><select id="period2" aria-label="חודש" style="width:auto"></select></div>
  <div class="list" id="list" aria-live="polite"></div>
  <section class="sum" id="potBox" hidden aria-label="רווח פוטנציאלי"></section>
</div>

<div id="sheetHost"></div>
<div id="toastHost"></div>

<script>
(function(){
'use strict';
var STAGES=[
  {id:'talked',name:'דיברנו'},{id:'hot',name:'ליד חם'},{id:'catalog',name:'קיבל קטלוג'},{id:'visit',name:'מבקשים ביקור'},{id:'viewing',name:'הלך לראות'},
  {id:'closing',name:'סוגר'},{id:'delivered',name:'קיבל סחורה'},{id:'done',name:'נסגר'},{id:'season',name:'לעונה הבאה'},{id:'lost',name:'לא רלוונטי'}
];
var SM={};STAGES.forEach(function(s,i){s.i=i;SM[s.id]=s});
var stageColor=function(id){return 'var(--s-'+id+')'};
var DEAL=['delivered','done'];

var view='leads';
var projects=[],pjRecent={},pjGone={},editingProj=null;
var catalog=[],shipments=[],shRecent={},shGone={},editingShip=null,expenses=[],expRecent={},expGone={},editingExp=null;
var leads={},cfg={vat:18,supplierInCost:false,supplierPct:70},filter='open',period='all',editing=null,lastFocus=null;

function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
/* amounts are typed as text so "7,500" or "₪7500" works on every phone keyboard (a number input silently turns those into an empty value) */
function clean(v){return String(v==null?'':v).replace(/[₪,\s]/g,'')}
function n(v){var x=parseFloat(clean(v));return isFinite(x)?x:0}
function fmt(v){var r=Math.round(v);return (r<0?'-':'')+'₪'+Math.abs(r).toLocaleString('he-IL')}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dstr(iso){if(!iso)return '';var d=new Date(iso);return isNaN(d)?'':d.toLocaleDateString('he-IL',{day:'numeric',month:'numeric',year:'2-digit'})}
function toast(t){var el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=t;$('toastHost').appendChild(el);setTimeout(function(){el.remove()},Math.min(9000,2500+t.length*70))}
function waLink(p){var d=String(p||'').replace(/\D/g,'');if(!d)return '';if(d[0]==='0')d='972'+d.slice(1);return 'https://wa.me/'+d}

/* money for one lead */
function qtyOf(l){var q=Math.round(n(l&&l.qty));return q>=1?Math.min(q,999):1}
function calc(l){
  var q=qtyOf(l),price=n(l.price)*q,vat=n(cfg.vat)/100;                  // price and cost are per tent; the supplier's share and the commission are totals
  var incl=l.vatIncl!==false;
  var gross=incl?price:price*(1+vat);
  var net=incl?price/(1+vat):price;
  var cost=n(l.cost)*q,sup=n(l.supplier);
  var hasCom=l.commission!==''&&l.commission!=null&&isFinite(parseFloat(l.commission));      // our commission, exactly as written on the receipt, is the profit
  var profit=hasCom?n(l.commission):net-cost-(cfg.supplierInCost?0:sup);
  var xp=extrasProfit(l);                                                  // each extra has its own cost and profit; it adds to the lead's profit
  return {gross:gross,net:net,vat:gross-net,cost:cost,sup:sup,profit:profit+xp,deal:profit,xp:xp,has:price>0||hasCom,com:hasCom};
}

/* ---------- list ---------- */
function allLeads(){return Object.keys(leads).map(function(k){return Object.assign({id:k},leads[k])})}
function inPeriod(l){
  if(period==='all')return true;
  var t=l.dealAt||l.updatedAt;if(!t)return false;
  if(period.indexOf('m:')===0)return String(t).slice(0,7)===period.slice(2);       // a month chosen from the list, by closing date
  var d=new Date(t),now=new Date();
  if(period==='month')return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth();
  if(period==='last'){var p=new Date(now.getFullYear(),now.getMonth()-1,1);return d.getFullYear()===p.getFullYear()&&d.getMonth()===p.getMonth()}
  if(period==='year')return d.getFullYear()===now.getFullYear();
  return true;
}
function monthName(ym){var p=ym.split('-');return new Date(Date.UTC(+p[0],+p[1]-1,15)).toLocaleDateString('he-IL',{month:'long',year:'numeric',timeZone:'UTC'})}
function pad2(v){return String(v).length<2?'0'+v:String(v)}
function inPeriodStr(s){
  if(period==='all')return true;
  s=String(s||'');var now=new Date();
  if(period==='month')return s.slice(0,7)===now.getFullYear()+'-'+pad2(now.getMonth()+1);
  if(period==='last'){var p=new Date(now.getFullYear(),now.getMonth()-1,1);return s.slice(0,7)===p.getFullYear()+'-'+pad2(p.getMonth()+1)}
  if(period==='year')return s.slice(0,4)===String(now.getFullYear());
  if(period.indexOf('m:')===0)return s.slice(0,7)===period.slice(2);
  return true;
}
function renderPeriod(){
  var o=[['all','כל הזמן'],['month','החודש'],['last','חודש שעבר'],['year','השנה']],cnt={};
  allLeads().forEach(function(l){if(DEAL.indexOf(l.stage)>-1&&l.dealAt){var k=String(l.dealAt).slice(0,7);cnt[k]=(cnt[k]||0)+1}});
  Object.keys(cnt).sort().reverse().forEach(function(k){o.push(['m:'+k,monthName(k)+' ('+cnt[k]+')'])});
  if(period.indexOf('m:')===0&&!cnt[period.slice(2)])o.push([period,monthName(period.slice(2))+' (0)']);

/* screenshots -> proposal */
function shrink(file){
  return new Promise(function(res,rej){
    var img=new Image(),u=URL.createObjectURL(file);
    img.onload=function(){
      var sc=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement('canvas');
      c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
      var g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',0.82).split(',')[1]);
    };
    img.onerror=function(){URL.revokeObjectURL(u);rej(new Error('אי אפשר לפתוח את הקובץ כתמונה'))};
    img.src=u;
  });
}
function readShots(files){

  Promise.all(files.map(shrink)).then(function(imgs){return guard(api('POST','/alt/extract',{images:imgs}))}).then(function(r){
    b.remove();
    var f=r.fields||{};
    if(!r.matchId&&!f.name&&!f.phone&&!Object.keys(f).length){toast(r.summary||'לא זיהיתי פרטים בצילום');return}
    openEditor(r.matchId||null,{fields:f,summary:r.summary});

function chunkCsv(name,csv){

/* the month the file is about, from its name or its tab names ("מכירות יולי 2026", tab "יולי"): the last day of that month becomes the default closing date */

function guessMonth(names){
  var t=names.join(' '),mi=-1;
  HMONTHS.forEach(function(m,i){if(mi<0&&t.indexOf(m)>-1)mi=i});
  if(mi<0)return '';
  var y=(t.match(/20\d\d/)||[])[0],now=new Date();

function importFiles(files){
  files=[].slice.call(files);if(!files.length)return;

  if(!sheets.length&&!imgs.length){toast('בחרי קובץ אקסל, CSV או צילום');return}
  busy('קוראת את הקובץ…');
  var jobs=[],prep=Promise.resolve();
  sheets.forEach(function(f){
    prep=prep.then(function(){
      if(/\.csv$/i.test(f.name))return readText(f).then(function(t){chunkCsv(f.name,t).forEach(function(c){jobs.push({text:c})})});
      return Promise.all([loadSheetJs(),f.arrayBuffer()]).then(function(r){
        var wb=r[0].read(r[1],{type:'array',cellDates:true});

  });
  if(imgs.length)prep=prep.then(function(){return Promise.all(imgs.map(shrink))}).then(function(arr){jobs.push({images:arr})});
  var items=[];
  prep.then(function(){
    if(!jobs.length)throw new Error('לא מצאתי שורות בקובץ');
    var p=Promise.resolve();
    jobs.forEach(function(j,i){p=p.then(function(){busy('קוראת… '+(i+1)+' מתוך '+jobs.length);return guard(api('POST','/alt/import',j)).then(function(r){items=items.concat(r.items||[])})})});
    return p;
  }).then(function(){unbusy();if(!items.length){toast('לא זיהיתי לידים בקובץ');return}openImport(items)}).catch(function(e){unbusy();if(!e.status)toast(e.message||'הייבוא נכשל')});

/* marketing expenses */
/* a new expense is dated in the month being viewed (the last day of it), otherwise today */
function defaultExpDate(){
  if(period.indexOf('m:')===0){var p=period.slice(2).split('-');return new Date(Date.UTC(+p[0],+p[1],0)).toISOString().slice(0,10)}
  if(period==='last'){var nw=new Date();return new Date(Date.UTC(nw.getFullYear(),nw.getMonth(),0)).toISOString().slice(0,10)}
  return today();
}

function xmRun(kind,date){
  var ids=Object.keys(XSEL);if(!ids.length)return;
  if(kind==='date'&&!date){toast('בחרי תאריך');return}
  var done=0;busy((kind==='date'?'מעדכנת ':'מוחקת ')+'0 מתוך '+ids.length);
  var p=Promise.resolve();
  ids.forEach(function(id){p=p.then(function(){
    var x=expenses.filter(function(e){return e.id===id})[0];if(!x)return;
    if(kind==='date')return guard(api('PUT','/alt/expenses/'+id,{date:date,amount:x.amount,label:x.label})).then(function(r){expenses=expenses.filter(function(e){return e.id!==id}).concat([r.expense]);expRecent[id]={item:r.expense,at:Date.now()};done++;busy('מעדכנת '+done+' מתוך '+ids.length)});
    return guard(api('DELETE','/alt/expenses/'+id)).then(function(){expenses=expenses.filter(function(e){return e.id!==id});expGone[id]=Date.now();delete expRecent[id];done++;busy('מוחקת '+done+' מתוך '+ids.length)});
  })});
  p.then(function(){unbusy();XSEL={};render();paintExpMgr();toast(kind==='date'?'התאריך עודכן ל-'+done+' הוצאות':'נמחקו '+done+' הוצאות')}).catch(function(){unbusy();render();paintExpMgr();toast('בוצעו '+done+' מתוך '+ids.length)});
}

/* csv */
function csvCell(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function exportCsv(){
  var rows=[['שם','טלפון','מוצר','שלב','מקור','מחיר לאוהל','כמות','כולל מעמ','לפני מעמ','מעמ','עלות מוצר','ספק','ספק קיבל','רווח','תאריך סגירה','תאריך אספקה','מספר קבלה','תוספות','סכום תוספות','רווח תוספות']];
  allLeads().forEach(function(l){var c=calc(l);rows.push([l.name,l.phone,l.product,(SM[l.stage]||{}).name,l.source,l.price,qtyOf(l),l.vatIncl===false?'לא':'כן',Math.round(c.net),Math.round(c.vat),l.cost,l.suppName,l.supplier,Math.round(c.profit),l.dealAt?l.dealAt.slice(0,10):'',l.deliveryDate||'',l.receiptNo||'',(l.extras||[]).map(function(x){return (x.label||x.k)+(x.amount!==''?' '+x.amount:'')}).join(' + '),Math.round(extrasTotal(l)),Math.round(extrasProfit(l))]);});
  var csv='\ufeff'+rows.map(function(r){return r.map(csvCell).join(',')}).join('\n');
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='leads-'+today()+'.csv';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var t=e.target;
  var a=t.closest('[data-stop]');if(a)return;
  var tab=t.closest('[data-f]');if(tab){filter=tab.dataset.f;try{localStorage.setItem('crmFilter',filter)}catch(x){}render();return}
  var adv=t.closest('[data-adv]');if(adv){e.stopPropagation();advance(adv.dataset.adv);return}
  var stg=t.closest('[data-stg]');if(stg&&$('sheet')){$('sheet').dataset.stage=stg.dataset.stg;syncStage(stg.dataset.stg);[].forEach.call($('stages').children,function(b){b.setAttribute('aria-pressed',String(b===stg))});return}
  var se=t.closest('[data-season]');if(se){e.stopPropagation();openFollow(se.dataset.season,true);return}
  var fo=t.closest('[data-follow]');if(fo){e.stopPropagation();openFollow(fo.dataset.follow,false);return}
  var fc=t.closest('[data-fchip]');if(fc){$('f_fdate').value=fc.dataset.fchip;return}
  if(t.id==='folClear'){saveFollow(true);return}
  var vs=t.closest('[data-visit]');if(vs){e.stopPropagation();askVisit(vs.dataset.visit);return}
  var ht=t.closest('[data-hot]');if(ht){e.stopPropagation();gotHot(ht.dataset.hot);return}
  var ct=t.closest('[data-cat]');if(ct){e.stopPropagation();gotCatalog(ct.dataset.cat);return}
  var ir=t.closest('[data-irr]');if(ir){e.stopPropagation();irrelevant(ir.dataset.irr,true);return}
  var un=t.closest('[data-undo]');if(un){e.stopPropagation();irrelevant(un.dataset.undo,false);return}
  var pk=t.closest('[data-pickid]');if(pk){var pid=pk.dataset.pickid;if(SEL.ids[pid])delete SEL.ids[pid];else SEL.ids[pid]=1;render();return}
  if(t.id==='projBtn'){view='proj';SEL.on=false;SEL.ids={};loadProjects();render();window.scrollTo(0,0);return}
  if(t.id==='pjAdd'){openProject(null);return}
  var pjo=t.closest('[data-pjopen]');if(pjo){openProject(pjo.dataset.pjopen);return}
  var pja=t.closest('[data-pjadd]');if(pja){pjAddRow(pja.dataset.pjadd);return}
  if(t.closest('[data-pjdel]')){var rw=t.closest('.pjrow');if(rw)rw.remove();pjUpdate();return}
  if(t.id==='pjDelProject'){pjDelProject(t);return}
  if(t.id==='shipBtn'){view='ship';SEL.on=false;SEL.ids={};render();window.scrollTo(0,0);return}
  if(t.id==='shAdd'){openShipment(null);return}
  var shx=t.closest('[data-shedit]');if(shx){openShipment(shx.dataset.shedit);return}
  var sha=t.closest('[data-sharr]');if(sha){markArrived(sha.dataset.sharr,true);return}
  var shu=t.closest('[data-shundo]');if(shu){markArrived(shu.dataset.shundo,false);return}
  var shc=t.closest('[data-shdays]');if(shc){var bd=new Date(($('s_shipped').value||today())+'T12:00:00');bd.setDate(bd.getDate()+(+shc.dataset.shdays));$('s_eta').value=bd.getFullYear()+'-'+pad2(bd.getMonth()+1)+'-'+pad2(bd.getDate());return}
  if(t.id==='shDel'){delShipment(t);return}
  if(t.id==='moneyBtn'){view='money';SEL.on=false;SEL.ids={};render();window.scrollTo(0,0);return}
  if(t.id==='backBtn'){view='leads';render();window.scrollTo(0,0);return}
  if(t.id==='dupForce'){dupForce=true;paintDup();toast('אפשר לשמור');return}
  var od=t.closest('[data-opendup]');if(od){openEditor(od.dataset.opendup);return}
  if(t.id==='expAdd'){openExpense(null);return}
  if(t.id==='expMgr'){openExpMgr();return}
  if(t.id==='xmAll'){var allx=expenses.every(function(x){return XSEL[x.id]});XSEL={};if(!allx)expenses.forEach(function(x){XSEL[x.id]=1});paintExpMgr();return}
  var xg=t.closest('[data-xmgrp]');if(xg){var gk=xg.dataset.xmgrp,gl=expenses.filter(function(x){return String(x.date).slice(0,7)===gk}),gall=gl.every(function(x){return XSEL[x.id]});gl.forEach(function(x){if(gall)delete XSEL[x.id];else XSEL[x.id]=1});paintExpMgr();return}
  if(t.id==='xmApply'){xmRun('date',$('xm_date').value);return}
  if(t.id==='xmDel'){if(t.dataset.arm){xmRun('del')}else{t.dataset.arm='1';t.textContent='בטוחה? לחצי שוב'}return}
  var ex=t.closest('[data-exp]');if(ex){openExpense(ex.dataset.exp);return}
  if(t.id==='expDel'){delExpense(t);return}
  if(t.id==='selBtn'){SEL.on=!SEL.on;SEL.ids={};render();return}
  if(t.id==='selOff'){SEL.on=false;SEL.ids={};render();return}
  if(t.id==='selAll'){var vis=[].map.call(document.querySelectorAll('#list [data-pickid]'),function(e){return e.dataset.pickid});var allOn=vis.every(function(i){return SEL.ids[i]});vis.forEach(function(i){if(allOn)delete SEL.ids[i];else SEL.ids[i]=1});render();return}
  if(t.id==='selApply'){applySelDate();return}
  var op=t.closest('[data-open]');if(op){openEditor(op.dataset.open);return}
  if(t.id==='tgConnect'){var tk=$('tg_token').value.trim();if(tk)tgConnect(tk);return}
  if(t.id==='tgLink'){tgConnect('');return}
  if(t.id==='tgOff'){if(t.dataset.arm){guard(api('DELETE','/alt/telegram')).then(function(){tgLoad();toast('הבוט נותק')}).catch(function(){})}else{t.dataset.arm='1';t.textContent='בטוחה? לחצי שוב'}return}
  if(t.id==='outBtn'){api('POST','/alt/logout').then(function(){leads={};showLogin()});return}
  if(t.id==='supReset'){delete $('f_supplier').dataset.manual;autoSupplier();updCalc();return}
  if(t.id==='xAdd'){$('x_other').insertAdjacentHTML('beforeend',xRow('other',{}));return}
  if(t.closest('[data-xdel]')){t.closest('.xo').remove();return}
  if(t.id==='newBtn'){openEditor(null);return}
  if(t.id==='shotBtn'){$('shotIn').click();return}
  if(t.id==='impBtn'){$('impIn').click();return}
  if(t.id==='impGo'){runImport();return}
  if(t.id==='impApplyDate'){impDateVal=$('impDate').value;IMP.forEach(function(r){if(DEAL.indexOf(r.lead.stage)>-1)r.closed=impDateVal});paintImport();return}
  if(t.id==='impAll'){var allOn=IMP.every(function(r){return r.on});IMP.forEach(function(r){r.on=!allOn&&r.changed.length>0});paintImport();return}
  if(t.id==='settingsBtn'){openSettings();return}
  if(t.id==='csvBtn'){exportCsv();return}
  if(t.id==='cancelBtn'||t.id==='veil'){closeEditor();return}
  if(t.id==='delBtn'){armDelete(t)}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&$('veil'))closeEditor();
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.card')){e.preventDefault();openEditor(e.target.dataset.open)}
});
document.addEventListener('input',function(e){
  if(e.target.closest&&e.target.closest('#projForm'))pjUpdate();
  if(e.target.id==='f_supplier')e.target.dataset.manual='1';
  if(e.target.id==='f_name'||e.target.id==='f_phone'){dupForce=false;paintDup()}
  if(e.target.id==='f_price'||e.target.id==='f_qty')autoSupplier();
  var xr=e.target.closest&&e.target.closest('.xo');
  if(xr){if(e.target.classList.contains('xp'))e.target.dataset.manual='1';else if(e.target.classList.contains('xa')||e.target.classList.contains('xc'))autoXProfit(xr)}
  if(e.target.closest&&e.target.closest('fieldset'))updCalc()});
document.addEventListener('change',function(e){
  if(e.target.id==='shotIn'){readShots(e.target.files);e.target.value='';return}
  if(e.target.id==='impIn'){importFiles(e.target.files);e.target.value='';return}
  if(e.target.dataset&&e.target.dataset.xm!=null){if(e.target.checked)XSEL[e.target.dataset.xm]=1;else delete XSEL[e.target.dataset.xm];paintExpMgr();return}
  if(e.target.dataset&&e.target.dataset.imp!=null){IMP[+e.target.dataset.imp].on=e.target.checked;var on=IMP.filter(function(r){return r.on}).length,g=$('impGo');if(g){g.textContent='הוספה / עדכון של '+on;g.disabled=!on}return}
  if(e.target.dataset&&e.target.dataset.impstage!=null){var rr=IMP[+e.target.dataset.impstage];rr.lead.stage=e.target.value;if(DEAL.indexOf(rr.lead.stage)>-1&&!rr.closed&&impDateVal)rr.closed=impDateVal;paintImport();return}
  if(e.target.id==='period'||e.target.id==='period2'){period=e.target.value;render()}
  if(e.target.id==='p_vat'||e.target.id==='p_status'){pjUpdate();return}
  if(e.target.id==='f_vatIncl'){autoSupplier();[].forEach.call(document.querySelectorAll('#row_extras .xo'),autoXProfit);updCalc()}
  if(e.target.classList&&e.target.classList.contains('xk'))updCalc();
});
document.addEventListener('submit',function(e){
  e.preventDefault();
  if(e.target.id==='login'){
    $('l_err').textContent='';
    (needSetup?api('POST','/alt/setup',{adminPassword:$('l_admin').value,password:$('l_pass').value}):api('POST','/alt/login',{password:$('l_pass').value})).then(function(){$('l_pass').value='';$('l_admin').value='';return load()}).catch(function(x){$('l_err').textContent=x.message});
    return;
  }
  if(e.target.id==='sheet')saveEditor();
  if(e.target.id==='expForm')saveExpense();
  if(e.target.id==='folForm')saveFollow(false);
  if(e.target.id==='shForm')saveShipmentForm();
  if(e.target.id==='projForm')savePj();
  if(e.target.id==='setForm'){
    var v=n(val('s_vat'));if(v<0||v>100){toast('אחוז מע״מ לא תקין');return}
    guard(api('PUT','/alt/config',{vat:v,supplierInCost:$('s_sup').checked,supplierPct:val('s_pct')})).then(function(d){cfg=d.cfg;closeEditor();render();toast('נשמר')}).catch(function(){});
  }
});

/* ---------- boot ---------- */
try{var f=localStorage.getItem('crmFilter');if(f)filter=f}catch(x){}
renderPeriod();render();load();
setInterval(function(){if(!document.hidden&&!$('veil')&&!$('app').hidden){load();if(view==='proj')loadProjects()}},20000);
document.addEventListener('visibilitychange',function(){if(!document.hidden&&!$('veil')&&!$('app').hidden)load()});
})();
</script>
</body>
</html>
