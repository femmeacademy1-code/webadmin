# Deploys the Femme Digital CMS to Cloudflare Workers.
# One-time setup is described in README.md.
name: Deploy CMS to Cloudflare
on:
  push:
    branches: [main]
    paths: ['app/**', 'worker/**', 'tests/**']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test tests/worker.test.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CMS_ADMIN_PASSWORD: ${{ secrets.CMS_ADMIN_PASSWORD }}
      CMS_SESSION_SECRET: ${{ secrets.CMS_SESSION_SECRET }}
      CMS_GITHUB_TOKEN: ${{ secrets.CMS_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # Fails early, with a clear message, when a secret is missing or was pasted badly
      # (a stray line break in a secret breaks the HTTP headers and gives a confusing error).
      - name: Check secrets
        run: |
          ok=1
          check() {
            name="$1"; value="$2"
            if [ -z "$value" ]; then echo "::error::Secret $name is missing. Add it in Settings → Secrets and variables → Actions."; ok=0
            else
              case "$value" in
                *[[:space:]]*) echo "::error::Secret $name contains a space or line break. Delete it and paste ONLY the value, on one line."; ok=0 ;;
              esac
            fi
          }
          check CLOUDFLARE_API_TOKEN "$CLOUDFLARE_API_TOKEN"
          check CLOUDFLARE_ACCOUNT_ID "$CLOUDFLARE_ACCOUNT_ID"
          check CMS_SESSION_SECRET "$CMS_SESSION_SECRET"
          check CMS_GITHUB_TOKEN "$CMS_GITHUB_TOKEN"
          if [ -z "$CMS_ADMIN_PASSWORD" ]; then echo "::error::Secret CMS_ADMIN_PASSWORD is missing."; ok=0; fi
          if ! printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | grep -Eq '^[0-9a-f]{32}$'; then echo "::error::CLOUDFLARE_ACCOUNT_ID must be exactly 32 hex characters."; ok=0; fi
          if [ "${#CMS_SESSION_SECRET}" -lt 24 ]; then echo "::error::CMS_SESSION_SECRET should be at least 24 characters."; ok=0; fi
          [ "$ok" = 1 ]

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: '4'
          command: deploy

      # Secrets are set after the first deploy, once the Worker exists.
      - name: Set Worker secrets
        working-directory: worker
        run: |
          jq -n --arg a "$CMS_ADMIN_PASSWORD" --arg s "$CMS_SESSION_SECRET" --arg g "$CMS_GITHUB_TOKEN" \
            --arg ct "$CLOUDFLARE_API_TOKEN" --arg ca "$CLOUDFLARE_ACCOUNT_ID" \
            '{ADMIN_PASSWORD:$a, SESSION_SECRET:$s, GITHUB_TOKEN:$g, CF_API_TOKEN:$ct, CF_ACCOUNT_ID:$ca}' | npx --yes wrangler@4 secret bulk
